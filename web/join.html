<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f10">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Join a home on Kova</title>
<link rel="icon" href="./assets/logo/kova-favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--page:#0e0f10;--card:#16171a;--inset:#1c1d20;--bone:#f1efea;--stone:#a3a09a;--stone2:#6f6d69;--amber:#f2b14c;--green:#7fd4a0;--red:#ff6b5e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:var(--page);color:var(--bone);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;min-width:0}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.02em;overflow-wrap:anywhere}
  p{margin:0;color:var(--stone);font-size:14px;line-height:1.55}
  .card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .role{align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(242,177,76,0.14);color:var(--amber)}
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .who button{width:auto;margin:0;padding:10px 14px;background:var(--inset);color:var(--bone);border:1px solid rgba(255,255,255,.08)}
  .who button[aria-pressed="true"]{background:var(--bone);color:#141517;border-color:var(--bone)}
  input{width:100%;padding:11px 12px;border-radius:12px;background:var(--inset);border:1px solid rgba(255,255,255,.08);color:var(--bone);font:inherit;font-size:15px}
  button{width:100%;padding:12px;border-radius:12px;border:0;background:var(--amber);color:#1a1408;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .ghost{background:rgba(255,255,255,0.06);color:var(--bone)}
  .err{color:var(--red);font-size:13.5px;line-height:1.5}
  .ok{color:var(--green)}
  .muted{color:var(--stone2);font-size:12.5px;line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div style="display:flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 48 48" style="flex:none"><path d="M8 26L24 11L40 26" fill="none" stroke="#f1efea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 32L24 24.5L32 32" fill="none" stroke="#f1efea" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="38.5" r="3.5" fill="#f2b14c"/></svg><h1 id="title">Join a home</h1></div>
  <p id="intro">Checking your invite…</p>

  <div class="card" id="codeCard" hidden>
    <label for="code" style="font-size:14px;font-weight:700">Your invite code</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE-23456" style="font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase">
    <button id="codeBtn">Continue</button>
  </div>

  <div class="card" id="joinCard" hidden>
    <span class="role" id="role"></span>
    <p id="roleNote"></p>
    <div id="pickWrap">
      <span style="font-size:14px;font-weight:700;display:block;margin-bottom:10px">Who are you?</span>
      <div class="who" id="who" role="group" aria-label="Who are you?"></div>
    </div>
    <div id="nameWrap" hidden><label for="name" style="font-size:14px;font-weight:700;display:block;margin-bottom:8px">Your name</label><input id="name" autocomplete="given-name" maxlength="40" placeholder="Your name"></div>
    <button id="joinBtn">Join</button>
    <a id="appBtn" hidden style="display:block;text-align:center;padding:12px;border-radius:12px;background:rgba(255,255,255,0.06);color:var(--bone);text-decoration:none;font-weight:700;font-size:14px">Open in the Kova app instead</a>
    <p class="muted">This browser gets its own sign-in, kept on your home’s hub. The owner can see it and sign it out.</p>
  </div>

  <p class="err" id="err" role="alert" hidden></p>
  <p class="ok" id="done" hidden>You’re in. Opening the home…</p>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NOTE = {
    owner: 'You’ll be an owner: everything, including people, integrations, updates and backups.',
    adult: 'You can control the devices and modes, make automations and ask Kova.',
    child: 'You can control the devices in your rooms.',
    guest: 'You can control the rooms and devices you were given.',
  };
  var params = new URLSearchParams((location.hash || '').replace(/^#/, '') || location.search.slice(1));
  var code = (params.get('code') || '').trim(), picked = null, info = null;
  // Not on this page's address bar or in its history: the code is used once.
  if (location.hash) history.replaceState(null, '', location.pathname);

  function fail(msg) { var e = $('err'); e.textContent = msg; e.hidden = false; }
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('The hub answered HTTP ' + r.status)); return j; });
    });
  }
  function when(t) { return new Date(t).toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }

  function show(i) {
    info = i;
    $('title').textContent = 'Join ' + i.home;
    $('intro').textContent = i.person ? 'You’re invited as ' + i.person.name + '.' : 'You’re invited to ' + i.home + ' on Kova.';
    $('role').textContent = i.roleLabel;
    var note = NOTE[i.role] || '';
    if (i.rooms && i.rooms.length) note += ' Rooms: ' + i.rooms.join(', ') + '.';
    if (i.until) note += ' Until ' + when(i.until) + '.';
    $('roleNote').textContent = note;
    var who = $('who');
    who.innerHTML = '';
    if (i.person || i.name) { $('pickWrap').hidden = true; $('nameWrap').hidden = true; picked = i.person ? { id: i.person.id } : { name: i.name }; }
    else {
      (i.people || []).forEach(function (p) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = p.name; b.setAttribute('aria-pressed', 'false');
        b.onclick = function () { pick({ id: p.id }, b); };
        who.appendChild(b);
      });
      var n = document.createElement('button'); n.type = 'button'; n.textContent = (i.people || []).length ? 'Someone else' : 'Add my name'; n.setAttribute('aria-pressed', 'false');
      n.onclick = function () { pick({ name: true }, n); };
      who.appendChild(n);
      if (!(i.people || []).length) pick({ name: true }, n);
    }
    // On a phone: the app can take the same invite (kova://join with this hub's address).
    if (/iPhone|iPad|Android/.test(navigator.userAgent)) {
      var q = new URLSearchParams({ url: location.origin, code: code });
      if (params.get('hub')) q.set('hub', params.get('hub'));
      params.getAll('alt').forEach(function (a) { q.append('alt', a); });
      $('appBtn').href = 'kova://join?' + q.toString();
      $('appBtn').hidden = false;
    }
    $('joinCard').hidden = false;
  }
  function pick(p, btn) {
    picked = p;
    Array.prototype.forEach.call($('who').children, function (c) { c.setAttribute('aria-pressed', c === btn ? 'true' : 'false'); });
    $('nameWrap').hidden = !p.name;
    if (p.name) $('name').focus();
  }
  function peek() {
    $('err').hidden = true;
    post('/api/invite/peek', { code: code }).then(function (i) { $('codeCard').hidden = true; show(i); }).catch(function (e) {
      $('intro').textContent = 'This invite didn’t work.';
      fail(e.message); $('codeCard').hidden = false;
    });
  }
  $('joinBtn').onclick = function () {
    $('err').hidden = true;
    if (!picked) return fail('Choose who you are first.');
    var body = { code: code };
    if (picked.id && !(info && info.person)) body.personId = picked.id;
    if (picked.name === true) { var n = $('name').value.trim(); if (!n) return fail('Type your name first.'); body.name = n; }
    $('joinBtn').disabled = true;
    post('/api/invite/accept', body).then(function (r) {
      try { localStorage.setItem('kova_token', r.token); } catch (e) {}
      $('joinCard').hidden = true; $('done').hidden = false;
      setTimeout(function () { location.replace('/'); }, 600);
    }).catch(function (e) { fail(e.message); }).finally(function () { $('joinBtn').disabled = false; });
  };
  $('codeBtn').onclick = function () { code = $('code').value.trim(); if (code) peek(); };
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('codeBtn').onclick(); });
  if (code) peek(); else { $('intro').textContent = 'Type the code from your invite.'; $('codeCard').hidden = false; }
})();
</script>
</body>
</html>
