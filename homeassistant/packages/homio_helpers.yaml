input_boolean:
  homio_heating_control:
    name: Heating Control
    initial: off
  homio_hot_water_control:
    name: Hot Water Control
    initial: off
  homio_mobile_navigation:
    name: Mobile Navigation
    initial: off
input_number:
  homio_thermostat_target_temperature:
    name: Homio Thermostat Target Temperature
    min: 7
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider

template:
  - sensor:
      - name: "Home Temperature"
        unique_id: homio_home_temperature
        unit_of_measurement: "°C"
        state: "{{ state_attr('weather.forecast_home', 'temperature') | default(0) }}"
        device_class: temperature
      - name: "Home Humidity"
        unique_id: homio_home_humidity
        unit_of_measurement: "%"
        state: "{{ state_attr('weather.forecast_home', 'humidity') | default(0) }}"
        device_class: humidity
