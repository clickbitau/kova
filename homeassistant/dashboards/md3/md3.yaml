                              apex_config:
                                chart:
                                  height: 240
                                legend:
                                  show: true
                                grid:
                                  yaxis:
                                    lines:
                                      show: false
                                xaxis:
                                  crosshairs:
                                    show: false
                                  tooltip:
                                    enabled: false
                                yaxis:
                                  - id: rain
                                    title:
                                      text: Rain (mm)
                                    opposite: false
                                  - id: temp
                                    title:
                                      text: Temp (°C)
                                    opposite: true
                                    decimalsInFloat: 0
                              series:
                                - entity: >-
                                    weather.forecast_home
                                  name: Rain
                                  type: column
                                  yaxis_id: rain
                                  data_generator: >
                                    return entity.attributes.forecasts.map(f =>
                                    {
                                      let val = f.precipitation;
                                      let color = '#9e9e9e';
                                      if (val > 0 && val < 2.5) {
                                        color = '#4FC3F7';
                                      } else if (val < 7.6) {
                                        color = '#0288D1';
                                      } else if (val < 35) {
                                        color = '#01579B';
                                      } else {
                                        color = '#311B92';
                                      }
                                      return {
                                        x: new Date(f.datetime).getTime(),
                                        y: val,
                                        fillColor: color
                                      };
                                    });
                                - entity: >-
                                    weather.forecast_home
                                  name: Temp
                                  type: line
                                  curve: smooth
                                  yaxis_id: temp
