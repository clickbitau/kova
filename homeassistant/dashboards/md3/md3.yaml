views:
  - title: Overview
    header:
      card:
        type: custom:stack-in-card
        mode: vertical
        cards:
          - type: custom:streamline-card
            template: date_clock_text_card
            variables:
              - title: '{{ now().strftime(''%a %b %-d - %I:%M %p'') }}'
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: weather.forecast_home
                icon: >-
                  {% set c = states('weather.forecast_home') %}
                  {% if 'cloudy' in c %}mdi:weather-cloudy
                  {% elif 'rain' in c %}mdi:weather-rainy
                  {% elif 'sunny' in c or 'clear' in c %}mdi:weather-sunny
                  {% elif 'snow' in c %}mdi:weather-snowy
                  {% elif 'fog' in c %}mdi:weather-fog
                  {% elif 'thunder' in c or 'lightning' in c %}mdi:weather-lightning
                  {% elif 'wind' in c %}mdi:weather-windy
                  {% else %}mdi:weather-partly-cloudy
                  {% endif %}
                icon_color: >-
                  {% set t = state_attr('weather.forecast_home','temperature') | float(20) %}
                  {% if t > 30 %}red{% elif t > 25 %}orange{% elif t > 20 %}amber{% elif t > 15 %}green{% else %}blue{% endif %}
                tap_action:
                  action: more-info
              - type: template
                entity: sensor.active_notification_count
                icon: mdi:bell
                tap_action:
                  action: navigate
                  navigation_path: '#notifications'
                hold_action:
                  action: none
                card_mod:
                  style: >
                    ha-card {
                      position: relative;
                      transition: transform 0.3s ease, box-shadow 0.3s ease;
                    }

                    {% set notifications =
                    states('sensor.active_notification_count') | int %}

                    {% if notifications > 0 %}

                    ha-card:after {
                      content: "{{ notifications }}";
                      position: absolute;
                      top: -3px;
                      right: -3px;
                      background-color: var(--md-sys-color-on-primary);
                      color: var(--md-sys-color-primary);
                      border-radius: 50%;
                      width: 16px;
                      height: 16px;
                      font-size: 10px;
                      line-height: 16px;
                      text-align: center;
                      display: inline-block;
                      font-weight: bold;

                    } {% endif %}
            alignment: end
            card_mod:
              style: |
                ha-card {
                  position: absolute;
                  top: 20px;
                  right: 5px;
                  animation: fadeInRight 0.5s ease-out;
                }
                @keyframes fadeInRight {
                  from {
                    opacity: 0;
                    transform: translateX(40px);
                  }
                  to {
                    opacity: 1;
                    transform: translateX(0);
                  }
                }
      layout: responsive
      badges_position: bottom
      badges_wrap: wrap
    type: sections
    max_columns: 4
    path: overview
    theme: Material You
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: |
                  {% set time = now().hour %} {% if time >= 18 %}
                    🌙 Evening, {{ user }}!
                  {% elif time >= 12 %}
                    ☀️ Afternoon, {{ user }}!
                  {% elif time >= 5 %}
                    🌅 Morning, {{ user }}!
                  {% else %}
                    🌌 Welcome, {{ user }}!
                  {% endif %}
                card_mod:
                  style: |
                    ha-card {
                      animation: fadeInUp 1.0s ease-out;
                    }
                    @keyframes fadeInUp {
                      from {
                        opacity: 0;
                        transform: translateY(20px);
                      }
                      to {
                        opacity: 1;
                        transform: translateY(0);
                      }
                    }
              - type: custom:paper-buttons-row
                styles:
                  justify-content: flex-start
                  flex-wrap: wrap
                  font-size: 0.9em
                  line-height: 1.2em
                  margin: 6px 0 20px 0
                  width: 100%
                buttons:
                  - layout: name
                    name: Outside is
                    styles:
                      button:
                        flex-basis: 1
                        flex-shrink: 0
                        animation: fadeIn 0.8s ease-out 0.3s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name|icon
                    entity: weather.forecast_home
                    name: >-
                      {% set temp = state_attr('weather.forecast_home', 'temperature') %}
                      {% set unit = state_attr('weather.forecast_home',
                      'temperature_unit') %} {% set condition =
                      states('weather.forecast_home') | title %} {% if
                      is_state('binary_sensor.lamp_cloud_connection',
                      'on') %}
                        {{ temp }} {{ unit }}, Raining
                      {% else %}
                        {{ temp }} {{ unit }}, {{ condition }}
                      {% endif %}
                    icon: >-
                      {% if
                      is_state('binary_sensor.lamp_cloud_connection',
                      'on') %}
                        mdi:weather-pouring
                      {% else %}
                        {{ states('sensor.weather_condition_icon') }}
                      {% endif %}
                    tap_action:
                      action: navigate
                      navigation_path: '#weather-panel'
                    styles:
                      icon:
                        color: var(--md-sys-color-primary)
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        display: flex
                        animation: slideInLeft 0.6s ease-out 0.5s both
                        transition: all 0.3s ease
                  - layout: name
                    name: · Wind
                    styles:
                      button:
                        flex-basis: 1
                        flex-shrink: 0
                        animation: fadeIn 0.8s ease-out 0.7s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name
                    entity: weather.forecast_home
                    name: >-
                      {% set weather = states.weather.forecast_home.attributes %} {{
                      weather.wind_speed }} {{ weather.wind_speed_unit }}
                    tap_action:
                      action: navigate
                      navigation_path: '#weather-panel'
                    styles:
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        display: flex
                        animation: slideInLeft 0.6s ease-out 0.9s both
                        transition: all 0.3s ease
                  - layout: name
                    name: · High
                    styles:
                      button:
                        flex-basis: 1
                        flex-shrink: 0
                        animation: fadeIn 0.8s ease-out 1.1s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name
                    entity: weather.forecast_home
                    name: >-
                      {% set forecast =
                      state_attr('weather.forecast_home',
                      'forecast_data') %} {% if forecast is defined and
                      forecast.temperature is defined %}
                        {{ forecast.temperature }} {{ state_attr('weather.forecast_home', 'temperature_unit') }}🔺
                      {% else %}
                        N/A {{ state_attr('weather.forecast_home', 'temperature_unit') }}🔺
                      {% endif %}
                    tap_action:
                      action: navigate
                      navigation_path: '#weather-panel'
                    styles:
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        display: flex
                        animation: slideInLeft 0.6s ease-out 1.3s both
                        transition: all 0.3s ease
                  - layout: name
