                        animation: fadeIn 0.8s ease-out 1.5s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name
                    entity: weather.forecast_home
                    name: >-
                      {% set forecast =
                      state_attr('weather.forecast_home',
                      'forecast_data') %} {% if forecast is defined and
                      forecast.temperature is defined %}
                        {{ forecast.templow }} {{ state_attr('weather.forecast_home', 'temperature_unit') }}🔻
                      {% else %}
                        N/A {{ state_attr('weather.forecast_home', 'temperature_unit') }}🔻
                      {% endif %}
                    tap_action:
                      action: navigate
                      navigation_path: '#weather-panel'
                    styles:
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        display: flex
                        animation: slideInLeft 0.6s ease-out 1.7s both
                        transition: all 0.3s ease
                card_mod:
                  style: |
                    ha-card {
                      overflow: visible !important;
                    }
                    @keyframes fadeIn {
                      from {
                        opacity: 0;
                      }
                      to {
                        opacity: 1;
                      }
                    }
                    @keyframes slideInLeft {
                      from {
                        opacity: 0;
                        transform: translateX(-40px);
                      }
                      to {
                        opacity: 1;
                        transform: translateX(0);
                      }
                    }
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  animation: slideInRight 1.0s cubic-bezier(0.4, 0, 0.2, 1) 1.0s both;
