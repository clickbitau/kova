kiosk_mode:
  mobile_settings:
    hide_header: true
streamline_templates:
  title_card:
    variables:
      title: ''
    card:
      type: custom:mushroom-title-card
      title: '[[title]]'
      card_mod:
        style: |
          ha-card {
            --title-font-size: 20px !important;
          }
  title_subtitle_card:
    variables:
      title: ''
      subtitle: ''
      animation_delay: 0s
    card:
      type: custom:mushroom-title-card
      title: '[[title]]'
      subtitle: '[[subtitle]]'
      card_mod:
        style: |
          ha-card {
            --title-font-size: 20px !important;
            --subtitle-font-size: 14px !important;
            animation: fadeIn 1.0s ease-out [[animation_delay]] both;
          }
          @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
          }
  title_subtitle_navigation_card:
    variables:
      title: ''
      subtitle: ''
      navigation_path: ''
    card:
      type: custom:mushroom-title-card
      title: '[[title]]'
      subtitle: '[[subtitle]]'
      title_tap_action:
        action: navigate
        navigation_path: '[[navigation_path]]'
      card_mod:
        style: |
          ha-card {
            --title-font-size: 20px !important;
            --subtitle-font-size: 14px !important;
          }
  title_navigation_card:
    variables:
      title: ''
      navigation_path: ''
    card:
      type: custom:mushroom-title-card
      title: '[[title]]'
      title_tap_action:
        action: navigate
        navigation_path: '[[navigation_path]]'
      card_mod:
        style: |
          ha-card {
            --title-font-size: 20px !important;
          }
  date_clock_text_card:
    variables:
      title: ''
    card:
      type: custom:mushroom-title-card
      title: '[[title]]'
      card_mod:
        style: |
          ha-card {
            --title-font-size: 15px !important;
            animation: fadeInDown 1.0s ease-out 0.3s both;
          }
          @keyframes fadeInDown {
            from {
              opacity: 0;
              transform: translateY(-40px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
  back_button_card:
    variables:
      navigation_path: ''
    card:
      type: custom:mushroom-chips-card
      chips:
        - type: template
          tap_action:
            action: navigate
            navigation_path: '[[navigation_path]]'
          icon: m3of:arrow-left-alt
          card_mod:
            style:
              .: |
                ha-card {
                  --color: var(--md-sys-color-primary);
                  --chip-background: var(--md-sys-color-on-primary);
                  animation: fadeInDown 0.4s ease-out 0.6s both;
                }
                @keyframes fadeInDown {
                  from {
                    opacity: 0;
                    transform: translateY(-40px);
                  }
                  to {
                    opacity: 1;
                    transform: translateY(0);
                  }
                }
  page_title_card:
    variables:
      - title: ''
      - alignment: center
    card:
      type: custom:button-card
      name: '[[title]]'
      show_icon: false
      show_state: false
      tap_action:
        action: none
      styles:
        card:
          - background: none
          - box-shadow: none
          - height: 38px
        name:
          - justify-self: '[[alignment]]'
          - font-size: 24px
          - font-weight: 500
          - letter-spacing: '-0.7px'
      card_mod:
        style: |
          :host {
            animation: fadeInDown 0.4s ease-out 0.6s both;
          }
          @keyframes fadeInDown {
            from {
              opacity: 0;
              transform: translateY(-40px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
  more-options-card:
    variables:
      navigation_path: ''
    card:
      type: custom:mushroom-chips-card
      alignment: end
      chips:
        - type: template
          tap_action:
            action: navigate
            navigation_path: '[[navigation_path]]'
          icon: mdi:dots-horizontal
          card_mod:
            style:
              .: |
                ha-card {
                  --color: var(--md-sys-color-primary);
                  --chip-background: var(--md-sys-color-on-primary);
                  animation: fadeInDown 0.4s ease-out 0.6s both;
                }
                @keyframes fadeInDown {
                  from {
                    opacity: 0;
                    transform: translateY(-40px);
                  }
                  to {
                    opacity: 1;
                    transform: translateY(0);
                  }
                }
  room_card:
    default:
      - name: ''
      - icon: ''
      - navigation_path: ''
      - entity_id_temperature: ''
      - entity_id_humidity: ''
      - entity_id_ac: ''
      - entity_id_ac_main: ''
      - entity_id_lights: ''
      - entity_id_covers: ''
      - entity_id_fans: ''
      - entity_id_doors: ''
      - entity_id_windows: ''
      - entity_id_speakers: ''
      - entity_id_custom_1: ''
      - entity_id_custom_2: ''
      - entity_id_custom_3: ''
      - entity_id_custom_4: ''
      - lights_count_sensor: ''
      - covers_count_sensor: ''
      - fans_count_sensor: ''
      - doors_count_sensor: ''
      - windows_count_sensor: ''
      - speakers_count_sensor: ''
      - lights_icon: ''
      - custom_1_icon: ''
      - custom_2_icon: ''
      - custom_3_icon: ''
      - custom_4_icon: ''
      - custom_1_color: ''
      - custom_2_color: ''
      - custom_3_color: ''
      - custom_4_color: ''
      - room_background: '#f5f5f5'
    card:
      type: custom:stack-in-card
      mode: horizontal
      cards:
        - type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              primary: '[[name]]'
              secondary: >
                {% set temp = states('[[entity_id_temperature]]') %} {% set hum
                = states('[[entity_id_humidity]]') %} {% set unit =
                state_attr('weather.forecast_home', 'temperature_unit') or '°C' %} {% set
                parts = [] %} {% if temp | is_number %}
                  {% set parts = parts + [temp | round(1) ~ unit] %}
                {% endif %} {% if hum | is_number %}
                  {% set parts = parts + [hum | round(1) ~ '%'] %}
                {% endif %} {{ parts | join(' / ') }}
              tap_action:
                action: navigate
                navigation_path: '[[navigation_path]]'
              card_mod:
                style: |
                  ha-card {
                    --primary-text-color: black;
                    border: 0;
                    padding: 5px 0 0 5px;
                    width: 500px;
                  }
            - type: custom:mushroom-template-card
              entity: '[[entity_id_lights]]'
              layout: horizontal
              icon: '[[icon]]'
              icon_color: >-
                {{ 'rgba(252, 242, 212, 1)' if is_state('[[entity_id_lights]]',
                'on') else 'rgba(91, 91, 91, 1)' }}
              tap_action:
                action: navigate
                navigation_path: '[[navigation_path]]'
              card_mod:
                style:
                  ha-tile-icon$: |
                    .container {
                      width: 120px !important;
                      height: 120px !important;
                      border-radius: 50%;
                    }   
                  .: |
                    ha-tile-icon {
                      --mdc-icon-size: 90px;
                    }
                    ha-card {
                      border: none;
                      margin: -8px 0 0 -28px;
                    }
        - type: custom:mushroom-chips-card
          chips:
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_ac_main]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_ac_main]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_ac]]'
                tap_action:
                  action: toggle
                icon: |
                  {% if is_state('[[entity_id_ac]]', 'off') %}
                    m3o:heat-pump
                  {% else %}
                    m3of:heat-pump
                  {% endif %}
                card_mod:
                  style: |
                    {% set ac_main = states('[[entity_id_ac_main]]') %}
                    {% set ac = states('[[entity_id_ac]]') %}
                    ha-card {
                      --chip-background: 
                        {% if ac == 'heat_cool' and ac_main == 'cool' %}
                          #b5e0f7
                        {% elif ac == 'heat_cool' and ac_main == 'heat' %}
                          #fa6f66
                        {% elif ac == 'heat_cool' and ac_main == 'fan_only' %}
                          #c3fae8
                        {% elif ac == 'heat_cool' and ac_main == 'dry' %}
                          #cfba74
                        {% elif ac == 'heat_cool' and ac_main == 'off' %}
                          #FFFFFF
                        {% else %}
                          #353535
                        {% endif %};
                      --color: {% if ac == 'off' %} #dbdbdb {% else %} #353535 {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_lights]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_lights]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_lights]]'
                tap_action:
                  action: more-info
                icon: '[[lights_icon]]'
                content: >-
                  {{ states('[[lights_count_sensor]]') if
                  states('[[lights_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: |
                    {% set light_state = states('[[entity_id_lights]]') %}
                    {% set is_on = light_state == 'on' %}
                    ha-card {
                      --chip-background: {% if is_on %} #fcf2d4 {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #5b5326 {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #5b5326 {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_covers]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_covers]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_covers]]'
                tap_action:
                  action: more-info
                icon: >
                  {% if is_state('[[entity_id_covers]]', 'open') or
                  is_state('[[entity_id_covers]]', 'opening') %}
                    m3of:curtains
                  {% else %}
                    m3of:curtains-closed
                  {% endif %}
                content: >-
                  {{ states('[[covers_count_sensor]]') if
                  states('[[covers_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: |
                    {% set cover_state = states('[[entity_id_covers]]') %}
                    {% set is_on = cover_state in ['open', 'opening'] %}
                    ha-card {
                      --chip-background: {% if is_on %} #702963 {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_fans]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_fans]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_fans]]'
                tap_action:
                  action: more-info
                icon: |
                  {% if is_state('[[entity_id_fans]]', 'on') %}
                    mdi:fan
                  {% else %}
                    mdi:fan-off
                  {% endif %}
                content: >-
                  {{ states('[[fans_count_sensor]]') if
                  states('[[fans_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: |
                    {% set fan_state = states('[[entity_id_fans]]') %}
                    {% set is_on = fan_state == 'on' %}
                    ha-card {
                      --chip-background: {% if is_on %} #89CFF0 {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #000000 {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #000000 {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_speakers]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_speakers]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_speakers]]'
                tap_action:
                  action: more-info
                icon: >
                  {% if is_state('[[entity_id_speakers]]', 'on') or
                  is_state('[[entity_id_speakers]]', 'playing') or
                  is_state('[[entity_id_speakers]]', 'paused') %}
                    mdi:speaker
                  {% else %}
                    mdi:speaker-off
                  {% endif %}
                content: >-
                  {{ states('[[speakers_count_sensor]]') if
                  states('[[speakers_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: >
                    {% set speaker_state = states('[[entity_id_speakers]]') %}

                    {% set is_on = speaker_state in ['on', 'playing', 'paused']
                    %}

                    ha-card {
                      --chip-background: {% if is_on %} #AFE1AF {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_windows]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_windows]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_windows]]'
                tap_action:
                  action: more-info
                icon: |
                  {% if is_state('[[entity_id_windows]]', 'on') %}
                    m3of:window-open
                  {% else %}
                    m3of:window-closed
                  {% endif %}
                content: >-
                  {{ states('[[windows_count_sensor]]') if
                  states('[[windows_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: |
                    {% set window_state = states('[[entity_id_windows]]') %}
                    {% set is_on = window_state == 'on' %}
                    ha-card {
                      --chip-background: {% if is_on %} #ffaa00 {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_doors]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_doors]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_doors]]'
                tap_action:
                  action: more-info
                icon: |
                  {% if is_state('[[entity_id_doors]]', 'on') %}
                    m3o:door-open
                  {% else %}
                    m3of:door-front
                  {% endif %}
                content: >-
                  {{ states('[[doors_count_sensor]]') if
                  states('[[doors_count_sensor]]') != '0' else '' }}
                card_mod:
                  style: |
                    {% set door_state = states('[[entity_id_doors]]') %}
                    {% set is_on = door_state == 'on' %}
                    ha-card {
                      --chip-background: {% if is_on %} #bc000a {% else %} #353535 {% endif %};
                      --color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_on %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_custom_1]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_custom_1]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_custom_1]]'
                tap_action:
                  action: more-info
                icon: >
                  {% set current_state = states('[[entity_id_custom_1]]') %} {%
                  set is_active = current_state in ['on', 'playing', 'paused',
                  'locked'] and current_state not in ['docked', 'off', 'idle',
                  'unavailable', 'unknown', 'unlocked'] %} {% if is_active %}
                    [[custom_1_icon_active]]
                  {% else %}
                    [[custom_1_icon_inactive]]
                  {% endif %}
                card_mod:
                  style: >
                    {% set current_state = states('[[entity_id_custom_1]]') %}

                    {% set is_active = current_state in ['on', 'playing',
                    'paused', 'locked'] and current_state not in ['docked',
                    'off', 'idle', 'unavailable', 'unknown', 'unlocked'] %}

                    ha-card {
                      --chip-background: {% if is_active %} [[custom_1_color]] {% else %} #353535 {% endif %};
                      --color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_custom_2]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_custom_2]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_custom_2]]'
                tap_action:
                  action: more-info
                icon: >
                  {% set current_state = states('[[entity_id_custom_2]]') %} {%
                  set is_active = current_state in ['on', 'playing', 'paused',
                  'locked'] and current_state not in ['docked', 'off', 'idle',
                  'unavailable', 'unknown', 'unlocked'] %} {% if is_active %}
                    [[custom_2_icon_active]]
                  {% else %}
                    [[custom_2_icon_inactive]]
                  {% endif %}
                card_mod:
                  style: >
                    {% set current_state = states('[[entity_id_custom_2]]') %}

                    {% set is_active = current_state in ['on', 'playing',
                    'paused', 'locked'] and current_state not in ['docked',
                    'off', 'idle', 'unavailable', 'unknown', 'unlocked'] %}

                    ha-card {
                      --chip-background: {% if is_active %} [[custom_2_color]] {% else %} #353535 {% endif %};
                      --color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_custom_3]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_custom_3]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_custom_3]]'
                tap_action:
                  action: more-info
                icon: >
                  {% set current_state = states('[[entity_id_custom_3]]') %} {%
                  set is_active = current_state in ['on', 'playing', 'paused',
                  'locked'] and current_state not in ['docked', 'off', 'idle',
                  'unavailable', 'unknown', 'unlocked'] %} {% if is_active %}
                    [[custom_3_icon_active]]
                  {% else %}
                    [[custom_3_icon_inactive]]
                  {% endif %}
                card_mod:
                  style: >
                    {% set current_state = states('[[entity_id_custom_3]]') %}

                    {% set is_active = current_state in ['on', 'playing',
                    'paused', 'locked'] and current_state not in ['docked',
                    'off', 'idle', 'unavailable', 'unknown', 'unlocked'] %}

                    ha-card {
                      --chip-background: {% if is_active %} [[custom_3_color]] {% else %} #353535 {% endif %};
                      --color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
            - type: conditional
              conditions:
                - condition: state
                  entity: '[[entity_id_custom_4]]'
                  state_not: unknown
                - condition: state
                  entity: '[[entity_id_custom_4]]'
                  state_not: unavailable
              chip:
                type: template
                entity: '[[entity_id_custom_4]]'
                tap_action:
                  action: more-info
                icon: >
                  {% set current_state = states('[[entity_id_custom_4]]') %} {%
                  set is_active = current_state in ['on', 'playing', 'paused',
                  'locked'] and current_state not in ['docked', 'off', 'idle',
                  'unavailable', 'unknown', 'unlocked'] %} {% if is_active %}
                    [[custom_4_icon_active]]
                  {% else %}
                    [[custom_4_icon_inactive]]
                  {% endif %}
                card_mod:
                  style: >
                    {% set current_state = states('[[entity_id_custom_4]]') %}

                    {% set is_active = current_state in ['on', 'playing',
                    'paused', 'locked'] and current_state not in ['docked',
                    'off', 'idle', 'unavailable', 'unknown', 'unlocked'] %}

                    ha-card {
                      --chip-background: {% if is_active %} [[custom_4_color]] {% else %} #353535 {% endif %};
                      --color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      --text-color: {% if is_active %} #ffffff {% else %} #dbdbdb {% endif %};
                      height: 35px;
                      width: 35px;
                      border-radius: 22px;
                    }
          card_mod:
            style: |
              .chip-container {
                flex-flow: column wrap-reverse !important;
                display: flex !important;
                --chip-spacing: 8px;
                margin: 9px;
              }
      card_mod:
        style: |
          ha-card {
            {% set temp = states('[[entity_id_temperature]]') %}
            {% if temp in ['unavailable', 'unknown', ''] %}
              background: [[room_background]];
            {% else %}
              {% set t = temp | float %}
              background:
              {% if t < 13 %} #AC9CAF
              {% elif t < 16 %} #D7C4DB
              {% elif t < 19 %} #A3D9F5
              {% elif t < 22 %} #CDE3DB
              {% elif t < 24 %} #FFE599
              {% elif t < 27 %} #F7BE81
              {% else %} #E48F7B {% endif %};
            {% endif %}
            height: 186px;
            contain: layout paint;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            animation:
              reveal 0s linear [[animation_delay]] forwards,
              fadeIn 0.35s ease-out [[animation_delay]] forwards;
          }
          @keyframes reveal {
            to { visibility: visible; }
          }
          @keyframes fadeIn {
            to { opacity: 1; }
          }
  room_toggles_chip_card:
    variables:
      - entity_area_one: ''
      - entity_area_two: ''
      - entity_area_three: ''
      - entity_area_four: ''
      - area_one_name: ''
      - area_two_name: ''
      - area_three_name: ''
      - area_four_name: ''
      - area_one_icon: ''
      - area_two_icon: ''
      - area_three_icon: ''
      - area_four_icon: ''
      - alignment: ''
      - animation_delay: 0s
    card:
      type: custom:mushroom-chips-card
      chips:
        - type: conditional
          conditions:
            - condition: state
              entity: '[[entity_area_one]]'
              state_not: unknown
            - condition: state
              entity: '[[entity_area_one]]'
              state_not: unavailable
          chip:
            type: template
            entity: '[[entity_area_one]]'
            icon: '[[area_one_icon]]'
            content: |-
              {% if is_state(entity, 'on') %} 
                [[area_one_name]]
              {% else %}
              {% endif %}
            tap_action:
              action: toggle
            card_mod:
              style:
                .: |
                  ha-card {
                    --text-color: var(--md-sys-color-primary);
                    --color: var(--md-sys-color-primary);
                    --chip-background: {{ 'var(--md-sys-color-on-primary)' if is_state('[[entity_area_one]]', 'on') else none }};
                    animation: slideInLeft 0.6s ease-out calc([[animation_delay]] + 0s) both;
                  }
                  @keyframes slideInLeft {
                    from { 
                      opacity: 0;
                      transform: translateX(-40px);
                    }
                    to { 
                      opacity: 1;
                      transform: translateX(0);
                    }
                  }
        - type: conditional
          conditions:
            - condition: state
              entity: '[[entity_area_two]]'
