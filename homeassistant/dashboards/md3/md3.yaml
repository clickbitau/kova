              - type: custom:paper-buttons-row
                styles:
                  justify-content: flex-start
                  flex-wrap: wrap
                  font-size: 0.9em
                  line-height: 1.2em
                  margin: 0 0 0 6px
                  width: 100%
                buttons:
                  - layout: name
                    name: Room is
                    styles:
                      button:
                        flex-basis: 1
                        flex-shrink: 0
                        animation: fadeIn 0.8s ease-out 0.3s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name
                    entity: sensor.home_temperature
                    name: >-
                      {% set temp = states('sensor.home_temperature') |
                      float(0) %} {% if temp < 18 %}Cold{% elif temp < 22
                      %}cool{% elif temp < 26 %}comfortable{% else %}warm{%
                      endif %} ({{ temp }}°C)
                    tap_action:
                      action: more-info
                    styles:
                      icon:
                        color: var(--md-sys-color-primary)
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        animation: slideInLeft 0.6s ease-out 0.5s both
                        transition: all 0.3s ease
                  - layout: name
                    name: and
                    styles:
                      button:
                        flex-basis: 1
                        flex-shrink: 0
                        animation: fadeIn 0.8s ease-out 0.7s both
                      name:
                        color: var(--primary-text-color)
                    tap_action:
                      action: none
                  - layout: name
                    entity: sensor.home_humidity
                    name: >-
                      {% set hum = states('sensor.home_humidity') | float(0)
                      %} {% if hum < 31 %}dry{% elif hum < 51 %}good{% else
                      %}humid{% endif %} ({{ hum }}%)
                    tap_action:
                      action: more-info
                    styles:
                      icon:
                        color: var(--md-sys-color-primary)
                      name:
                        color: var(--md-sys-color-primary)
                        font-weight: bold
                      button:
                        padding: 2px 8px
                        background-color: var(--md-sys-color-on-primary)
                        border-radius: 24px
                        flex-basis: 1
                        flex-shrink: 0
                        animation: slideInLeft 0.6s ease-out 0.9s both
                        transition: all 0.3s ease
                card_mod:
                  style: |
                    ha-card {
                      overflow: visible !important;
                    }
                    @keyframes fadeIn {
                      from {
                        opacity: 0;
                      }
                      to {
                        opacity: 1;
                      }
                    }
                    @keyframes slideInLeft {
                      from {
                        opacity: 0;
                        transform: translateX(-40px);
                      }
                      to {
                        opacity: 1;
                        transform: translateX(0);
                      }
                    }
              - type: custom:paper-buttons-row
                styles:
                  gap: 8px
                  justify-content: flex-start
                  overflow: scroll
                  margin: 12px 0 12px -18px
                  padding-left: 18px
                  width: 100%
                extra_styles: |
                  ::-webkit-scrollbar {
                    display: none;
                  }
                  @keyframes fadeInUp {
                    from {
                      opacity: 0;
                      transform: translateY(28px);
                    }
                    to {
                      opacity: 1;
                      transform: translateY(0);
                    }
                  }
                buttons:
                  - entity: automation.outdoor_presence_driveway
                    state_icons:
                      'on': m3of:sensor-occupied
                      'off': m3o:sensors-krx-off
                    layout: icon_name
                    name: Presence Sensor
                    tap_action:
                      action: toggle
                    styles:
                      name:
                        color: '#a8a8a8'
                        transition: color 0.3s ease, transform 0.3s ease
                      button:
                        padding: 12px
                        width: 76px
                        height: 76px
                        flex-basis: 1
                        flex-shrink: 0
                        display: flex
                        background-color: var(--popupBG)
                        border-radius: 24px
                        color: var(--white)
                        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1)
                        animation: fadeInUp 0.5s ease-out 0.4s both
                      icon:
                        '--mdc-icon-size': 26px
                        color: '#a8a8a8'
                        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1)
                    state_styles:
                      'on':
                        icon:
                          color: var(--primary-text-color)
                        name:
                          color: var(--primary-text-color)
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  animation: slideInRight 1.0s cubic-bezier(0.4, 0, 0.2, 1) 1.0s both;
                }

                @keyframes slideInRight {
                  from {
                    opacity: 0;
                    transform: translateX(40px);
                  }
                  to {
                    opacity: 1;
                    transform: translateX(0);
                  }
                }
            card:
              type: custom:simple-tabs
              pre-load: true
              active-background: var(--md-sys-color-primary)
              active-text-color: var(--md-sys-color-on-primary)
              text-color: var(--primary-text-color)
              tabs:
                - title: Room
                  icon: m3of:home
                  card:
                    type: vertical-stack
                    cards:
                      - type: custom:streamline-card
                        template: title_card
                        variables:
                          title: Light Switches
                      - type: horizontal-stack
                        cards:
                          - type: custom:streamline-card
                            template: material_light_button_card
                            variables:
                              entity: light.lounge_switch_switch_2
                          - type: custom:streamline-card
                            template: material_light_button_card
                            variables:
                              entity: light.lounge_switch_switch_2
                - title: Security
                  icon: mdi:cctv
                  card:
                    type: vertical-stack
                    cards:
                      - type: custom:streamline-card
                        template: title_card
                        variables:
                          - title: Cameras
                      - type: custom:webrtc-camera
                        url: >-
                          ffmpeg:rtsp://<id:password>@192.168.1.150/h265Preview_01_main#video=copy#audio=opus
                      - type: custom:webrtc-camera
                        url: >-
                          ffmpeg:rtsp://<id:password>@192.168.1.245/h265Preview_01_main#video=copy#audio=opus
                - title: Active
                  icon: m3of:play-circle
                  conditions:
                    - template: '{{ is_state(''group.doors_drw'', ''on'')}}'
                  card:
                    type: vertical-stack
                    cards:
                      - type: custom:streamline-card
                        template: open_doors_card
                        variables:
                          title: Doors
                          door_1: binary_sensor.lamp_cloud_connection
                          door_2: binary_sensor.lamp_cloud_connection
      - type: grid
        cards:
          - type: custom:streamline-card
            template: room_selector
            variables: {}
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image:
        media_content_id: /local/Blue - Portrait.webp
