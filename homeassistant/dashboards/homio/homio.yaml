  # ─── PRAYER ───
  - type: custom:grid-layout
    title: prayer
    path: prayer
    theme: homio
    layout: !include /config/dashboards/templates/includes/homio_screen_layout.yaml
    cards:
      - type: custom:button-card
        variables:
          image: prayer
          image_position: center center
        template:
          - homio_room
        name: Prayer
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: !include /config/dashboards/templates/includes/homio_entity_layout.yaml
        cards:
          # Fajr
          - type: custom:button-card
            entity: sensor.islamic_prayer_times_fajr_prayer
            name: Fajr
            template:
              - homio_entity
            show_entity_picture: false
            icon: mdi:weather-night
            tap_action:
              action: more-info
            styles:
              card:
                - background: >
                    [[[
                      const now = new Date();
                      const t = states['sensor.islamic_prayer_times_fajr_prayer'].state;
                      const [h,m] = t.split(':');
                      const prayer = new Date(); prayer.setHours(h,m,0);
                      const next = states['sensor.islamic_prayer_times_sunrise_time'].state;
                      const [nh,nm] = next.split(':');
                      const nextP = new Date(); nextP.setHours(nh,nm,0);
                      return (now >= prayer && now < nextP) ? "rgba(255,183,0,0.35)" : "rgba(255,255,255,0.1)";
                    ]]]
                - backdrop-filter: blur(12px)
                - height: 170px
                - padding-left: 40px
                - padding-right: 40px
                - scroll-snap-align: start
              icon:
                - color: white
                - width: 30px
                - height: 30px
              name:
                - color: var(--primary-text-color)
                - font-size: 16px
                - font-weight: 600
                - justify-self: start
                - margin-bottom: 5px
              state:
                - color: var(--primary-text-color)
                - font-size: 22px
                - justify-self: start
                - font-weight: 700
                - opacity: 0.9
              grid:
                - grid-template-columns: 1fr min-content
                - grid-column-gap: 20px
                - grid-template-rows: min-content
                - grid-template-areas: '"n i" "s i"'
                - place-content: center
          # Sunrise
          - type: custom:button-card
            entity: sensor.islamic_prayer_times_sunrise_time
            name: Sunrise
            template:
              - homio_entity
            show_entity_picture: false
            icon: mdi:weather-sunset-up
            tap_action:
              action: more-info
            styles:
              icon:
                - color: white
                - width: 30px
                - height: 30px
          # Dhuhr
          - type: custom:button-card
            entity: sensor.islamic_prayer_times_dhuhr_prayer
