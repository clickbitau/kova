        layout: !include /config/dashboards/templates/includes/homio_entity_layout.yaml
        cards:
          # Hero: Current power output with accent styling
          - type: custom:button-card
            entity: sensor.goodwe_solar_inverter_active_power
            name: Power Now
            show_state: true
            show_entity_picture: false
            icon: mdi:flash
            template:
              - homio_default
            tap_action:
              action: more-info
            styles:
              card:
                - background: "rgba(255,183,0,0.25)"
                - backdrop-filter: blur(12px)
                - height: 170px
                - padding-left: 40px
                - padding-right: 40px
                - scroll-snap-align: start
                - border: "1px solid rgba(255,183,0,0.3)"
              name:
                - color: var(--primary-text-color)
                - font-size: 14px
                - font-weight: 600
                - justify-self: start
                - text-transform: uppercase
                - letter-spacing: 2px
