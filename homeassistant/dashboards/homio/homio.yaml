kiosk_mode:
  admin_settings:
    ignore_entity_settings: true
  non_admin_settings:
    hide_header: true
    hide_sidebar: true

button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards

views:
  # ─── LIVING ROOM ───
  - type: custom:grid-layout
    title: living
    path: living
    theme: homio
    layout: !include /config/dashboards/templates/includes/homio_screen_layout.yaml
    cards:
      - type: custom:button-card
        variables:
          image: living
          image_position: center center
          show_temp: true
          temp_sensor: sensor.home_temperature
          show_humid: true
          humid_sensor: sensor.home_humidity
        template:
          - homio_room
        name: Living Room
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: !include /config/dashboards/templates/includes/homio_entity_layout.yaml
        cards:
          - type: custom:button-card
            variables:
              icon: pendent
            template:
              - homio_light
            entity: light.lounge_switch_switch_2
            name: Lounge
          - type: custom:button-card
            variables:
              icon: plug
            template:
              - homio_light
            entity: light.smart_lighting_2
            name: TV LED
          - type: custom:button-card
            variables:
              icon: plug
            template:
              - homio_light
            entity: light.smart_multicolor_bulb
            name: Lamp
          - type: custom:button-card
            variables:
              icon: dehumidifier
            template:
              - homio_entity
            entity: fan.lounge_purifier
            name: Purifier
            tap_action:
              action: toggle
          - type: custom:button-card
            entity: media_player.bedroom_oled_qa55s90dawxxy
            name: Samsung TV
            template:
              - homio_entity
            show_entity_picture: false
            icon: mdi:television
            tap_action:
              action: more-info
            styles:
              icon:
                - color: white
                - width: 30px
                - height: 30px
          - type: custom:button-card
            variables:
              icon: access_point
            template:
              - homio_entity
            entity: media_player.living_room_display
            name: Nest Hub
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.living_room
            name: Nest Hub Cam
            show_state: false
            camera_view: live
            card_mod:
              style: >
                ha-card {
                  width: 260px !important;
                  height: 170px !important;
                  border-radius: 20px !important;
                  overflow: hidden !important;
                  scroll-snap-align: start;
                  background: rgba(255,255,255,0.1) !important;
                  backdrop-filter: blur(12px);
                }
                img {
                  object-fit: cover !important;
                  height: 100% !important;
                }
          - type: picture-entity
            entity: camera.living_room_camera
            name: Living Cam
            show_state: false
            camera_view: live
            card_mod:
              style: >
                ha-card {
                  width: 260px !important;
                  height: 170px !important;
                  border-radius: 20px !important;
                  overflow: hidden !important;
                  scroll-snap-align: start;
                  background: rgba(255,255,255,0.1) !important;
                  backdrop-filter: blur(12px);
                }
                img {
                  object-fit: cover !important;
                  height: 100% !important;
                }

