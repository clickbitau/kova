dark_modern:
  # ── Base Colors ──
  primary-color: "#e8a945"
  accent-color: "#e8a945"
  
  # ── Background ──
  ha-card-background: "rgba(30, 31, 40, 0.92)"
  card-background-color: "rgba(30, 31, 40, 0.92)"
  lovelace-background: "#0d0d14"
  primary-background-color: "#0d0d14"
  secondary-background-color: "#161620"
  
  # ── Text ──
  primary-text-color: "#e8e8ed"
  secondary-text-color: "#9a9aad"
  text-primary-color: "#e8e8ed"
  disabled-text-color: "#555566"
  
  # ── Cards ──
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  ha-card-border-color: "rgba(255,255,255,0.04)"
  ha-card-box-shadow: "0 2px 12px rgba(0,0,0,0.4)"
  
  # ── Header / Sidebar ──
  app-header-background-color: "#0d0d14"
  app-header-text-color: "#e8e8ed"
  sidebar-background-color: "#0d0d14"
  sidebar-text-color: "#e8e8ed"
  sidebar-selected-background-color: "rgba(232,169,69,0.15)"
  sidebar-selected-icon-color: "#e8a945"
  
  # ── Dividers ──
  divider-color: "rgba(255,255,255,0.06)"
  
  # ── Switches / Toggles ──
  switch-checked-color: "#e8a945"
  switch-unchecked-button-color: "#555566"
  switch-unchecked-track-color: "#2a2a3a"
  
  # ── States ──
  state-icon-active-color: "#e8a945"
  state-icon-color: "#555566"
  
  # ── Buttons ──
  mdc-button-outline-color: "rgba(255,255,255,0.08)"
  
  # ── Chips ──
  ha-chip-background: "rgba(255,255,255,0.06)"
  
  # ── Mushroom Overrides ──
  mush-card-primary-font-size: "16px"
  mush-card-secondary-font-size: "13px"
  mush-card-primary-font-weight: "500"
  mush-card-secondary-font-weight: "400"
  mush-card-primary-color: "#e8e8ed"
  mush-card-secondary-color: "#9a9aad"
  mush-chip-background: "rgba(255,255,255,0.06)"
  mush-chip-border-radius: "20px"
  mush-chip-font-size: "13px"
  mush-control-border-radius: "14px"
  mush-icon-size: "42px"

  # ── Google Fonts ──
  primary-font-family: "'Inter', 'Roboto', sans-serif"
  paper-font-common-base_-_font-family: "'Inter', 'Roboto', sans-serif"
  paper-font-body1_-_font-family: "'Inter', 'Roboto', sans-serif"

  # ── Modes ──
  modes:
    dark:
      primary-color: "#e8a945"
